<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fichas de Prática — Workshop Musculares</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --text: #F1E9DD;
    --text-dim: #9C9080;
    --ocre: #C08A44;
    --ocre-dim: #6E4F29;
    --ring-track: rgba(255,255,255,.08);
    --hairline: rgba(255,255,255,.08);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; }
  body{
    background:#110E0B;
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
  }
  .inner{ max-width:440px; margin:0 auto; padding:0 24px; }

  /* ---- header ---- */
  .page-header{
    padding: max(30px, env(safe-area-inset-top)) 0 26px;
    background:#110E0B;
  }
  .eyebrow{ font-size:13px; color:var(--text-dim); }
  h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:30px;
    line-height:1.15;
    margin:4px 0 2px;
  }
  .meta{ font-size:14px; color:var(--text-dim); }

  /* ---- block panels ---- */
  .block-panel{ padding: 34px 0 8px; }
  .block-panel .inner{ padding-bottom:26px; }
  .block-panel.tone-1{ background:#15100A; }
  .block-panel.tone-2{ background:#1A130B; }
  .block-panel.tone-3{ background:#1F150B; }
  .block-panel.tone-4{ background:#140F13; }

  .transition-panel{
    background:#100D0A;
    padding:20px 0;
  }
  .transition-panel .inner{ padding-bottom:6px; }
  .transition-label{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-size:14px;
    color:var(--text-dim);
    text-align:center;
    margin-bottom:10px;
  }
  .transition-panel .exercise{ border-top:none; justify-content:center; }

  .block-head{
    display:flex;
    align-items:baseline;
    gap:10px;
    margin-bottom:22px;
  }
  .block-num{
    font-family:'Fraunces', serif;
    font-size:15px;
    color:var(--ocre);
    border:1px solid var(--ocre-dim);
    border-radius:50%;
    width:26px; height:26px;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .block-title{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:20px;
  }
  .block-total{
    margin-left:auto;
    font-size:13px;
    color:var(--text-dim);
    white-space:nowrap;
  }

  /* ---- exercise card ---- */
  .exercise{
    padding:20px 0;
    border-top:1px solid var(--hairline);
    display:flex;
    gap:16px;
  }
  .exercise.stacked{
    flex-direction:column;
    gap:14px;
  }
  .block-panel .exercise:first-of-type{ border-top:none; }

  .photo-strip{
    width:104px; height:104px;
    flex-shrink:0;
    border-radius:6px;
    overflow-x:auto;
    overflow-y:hidden;
    display:flex;
    scroll-snap-type:x mandatory;
    border:1px dashed rgba(255,255,255,.15);
    background:rgba(255,255,255,.03);
  }
  .photo-strip.has-photos{ border-style:solid; border-color:transparent; }
  .photo-strip img{
    width:104px; height:104px;
    object-fit:cover;
    flex-shrink:0;
    scroll-snap-align:start;
  }
  .photo-strip .empty{
    width:104px; height:104px;
    display:flex; align-items:center; justify-content:center;
    color:var(--text-dim);
    opacity:.4;
  }

  .photo-grid{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    width:100%;
  }
  .photo-grid img{
    width:calc(25% - 6px);
    aspect-ratio:1/1;
    object-fit:cover;
    border-radius:6px;
    flex-shrink:0;
  }

  .photo-caption{
    font-size:10px;
    color:var(--text-dim);
    text-align:center;
    margin-top:5px;
    width:104px;
  }
  .exercise.stacked .photo-caption{
    width:auto;
    text-align:left;
    margin-top:-4px;
  }

  .ex-body{ flex:1; min-width:0; }
  .ex-name{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:17px;
    line-height:1.3;
  }
  .ex-note{ font-size:13px; color:var(--text-dim); margin-top:4px; }

  .ex-row{
    display:flex;
    align-items:center;
    gap:14px;
    margin-top:12px;
  }
  .mini-ring-wrap{ position:relative; width:46px; height:46px; flex-shrink:0; }
  .mini-ring-wrap svg{ transform:rotate(-90deg); }
  .mini-ring-track{ stroke:var(--ring-track); }
  .mini-ring-fill{ stroke:var(--ocre); stroke-linecap:round; transition:stroke-dashoffset .2s linear; }
  .mini-time{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    font-size:11px;
    font-variant-numeric:tabular-nums;
    color:var(--text);
  }
  .mini-play{
    width:34px; height:34px;
    border-radius:50%;
    border:1px solid var(--ocre-dim);
    background:none;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    flex-shrink:0;
  }
  .mini-play svg{ width:13px; height:13px; fill:var(--ocre); }
  .mini-reset{
    background:none; border:none; color:var(--text-dim);
    cursor:pointer; padding:6px;
    display:flex; align-items:center; justify-content:center;
  }
  .mini-reset svg{ width:14px; height:14px; }

  .playlist-link{
    display:inline-flex;
    align-items:center;
    gap:8px;
    margin-top:12px;
    padding:9px 16px;
    border:1px solid var(--ocre-dim);
    border-radius:999px;
    color:var(--ocre);
    text-decoration:none;
    font-size:13px;
  }

  .seg-label{
    font-size:13px;
    color:var(--ocre);
    margin-top:10px;
    min-height:18px;
  }
  .seg-label .seg-count{ color:var(--text-dim); margin-left:6px; }
  .reps-badge{
    display:inline-flex;
    align-items:center;
    margin-top:12px;
    padding:8px 16px;
    border:1px solid var(--ocre-dim);
    border-radius:999px;
    color:var(--ocre);
    font-size:14px;
  }

  .tabs{
    position:sticky; top:0; z-index:10;
    background:#110E0B;
    border-bottom:1px solid var(--hairline);
    padding-top:env(safe-area-inset-top);
  }
  .tabs .inner{ display:flex; gap:8px; padding-top:10px; padding-bottom:10px; }
  .tab{
    flex:1;
    font:500 15px 'Inter',system-ui,sans-serif;
    color:var(--text-dim);
    background:none;
    border:1px solid var(--hairline);
    border-radius:999px;
    padding:10px 0;
    cursor:pointer;
  }
  .tab[aria-selected="true"]{
    color:var(--ocre);
    border-color:var(--ocre-dim);
    background:rgba(192,138,68,.08);
  }
  .ficha[hidden]{ display:none; }

  footer{
    padding:40px 0 calc(40px + env(safe-area-inset-bottom));
    text-align:center;
    background:#0D0A08;
  }
  footer p{
    font-family:'Fraunces', serif;
    font-size:16px;
    color:var(--ocre);
    margin:0;
  }
</style>
</head>

const blocks = [];
fichaBlocks.forEach((list, fi) => list.forEach(b => blocks.push(Object.assign({ficha: fi}, b))));

let audioCtx = null;
function ensureAudio(){ if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }
function playBell(){
  ensureAudio();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const now = audioCtx.currentTime;
  [880, 1320, 1760].forEach((freq, i) => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(i===0 ? 0.22 : 0.08, now + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 1.6);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + 1.7);
  });
}

function fmt(s){
  const m = Math.floor(s/60), r = s%60;
  return String(m).padStart(2,'0') + ':' + String(r).padStart(2,'0');
}

const R = 20, CIRC = 2*Math.PI*R;
const state = {}; // id -> {remaining, duration, running, timerId}

function idOf(bi, ei){ return bi + '-' + ei; }

function totalOf(ex){
  return ex.segments ? ex.segments.reduce((a,x)=>a+x[1],0) : (ex.duration || 0);
}

function photoHtml(ex){
  if (ex.noPhoto) return '';
  if (!ex.photos || ex.photos.length === 0){
    return `<div class="photo-strip"><div class="empty">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
        <circle cx="12" cy="5" r="2.4"/><path d="M12 8c-3 0-5 2-5 5v2h10v-2c0-3-2-5-5-5z"/>
      </svg></div></div>`;
  }
  if (ex.photos.length > 1){
    const imgs = ex.photos.map(p => `<img src="${p}" alt="${ex.name}">`).join('');
    return `<div class="photo-grid">${imgs}</div>`;
  }
  return `<div class="photo-strip has-photos"><img src="${ex.photos[0]}" alt="${ex.name}"></div>`;
}

function exerciseHtml(bi, ei, ex){
  const id = idOf(bi, ei);
  const firstDur = ex.segments ? ex.segments[0][1] : ex.duration;
  if (!ex.reps) state[id] = { remaining: firstDur, duration: firstDur, running: false, timerId: null,
                              segs: ex.segments || null, seg: 0, done: false };
  const playlistHtml = ex.playlist
    ? `<a class="playlist-link" href="${ex.playlist}" target="_blank" rel="noopener">Abrir playlist</a>`
    : '';
  const multi = ex.photos && ex.photos.length > 1;
  return `
    <div class="exercise${multi ? ' stacked' : ''}">
      ${ex.noPhoto ? '' : `<div>
        ${photoHtml(ex)}
        ${ex.photoCaption ? `<div class="photo-caption">${ex.photoCaption}</div>` : ''}
      </div>`}
      <div class="ex-body">
        <div class="ex-name">${ex.name}</div>
        ${ex.note ? `<div class="ex-note">${ex.note}</div>` : ''}
        ${ex.reps ? `<div class="reps-badge">${ex.reps} repetições</div>` : `
        ${ex.segments ? `<div class="seg-label" id="seg-${id}"></div>` : ''}
        <div class="ex-row">
          <div class="mini-ring-wrap">
            <svg width="46" height="46">
              <circle class="mini-ring-track" cx="23" cy="23" r="${R}" fill="none" stroke-width="3"/>
              <circle class="mini-ring-fill" id="ring-${id}" cx="23" cy="23" r="${R}" fill="none" stroke-width="3"
                stroke-dasharray="${CIRC}" stroke-dashoffset="0"/>
            </svg>
            <div class="mini-time" id="time-${id}">${fmt(ex.duration)}</div>
          </div>
          <button class="mini-play" id="play-${id}" aria-label="Play/Pausa"></button>
          <button class="mini-reset" id="reset-${id}" aria-label="Reiniciar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 3v5h5"/>
            </svg>
          </button>
        </div>`}
        ${playlistHtml}
      </div>
    </div>`;
}

function blockHtml(b, bi, counter){
  const totalSec = b.exercises.reduce((a,e)=>a+totalOf(e),0);
  if (b.type === 'transition'){
    return `
    <section class="block-panel transition-panel">
      <div class="inner">
        <div class="transition-label">— ${b.name} —</div>
        ${b.exercises.map((ex, ei) => exerciseHtml(bi, ei, ex)).join('')}
      </div>
    </section>`;
  }
  return `
  <section class="block-panel tone-${counter}">
    <div class="inner">
      <div class="block-head">
        <div class="block-num">${counter}</div>
        <div class="block-title">${b.name}</div>
        <div class="block-total">${fmt(totalSec)}</div>
      </div>
      ${b.exercises.map((ex, ei) => exerciseHtml(bi, ei, ex)).join('')}
    </div>
  </section>`;
}

function buildPage(){
  [0, 1].forEach(fi => {
    let counter = 0;
    document.getElementById('ficha-'+fi).innerHTML = blocks.map((b, bi) => {
      if (b.ficha !== fi) return '';
      if (b.type !== 'transition') counter += 1;
      return blockHtml(b, bi, counter);
    }).join('');
  });

  blocks.forEach((b, bi) => b.exercises.forEach((ex, ei) => {
    const id = idOf(bi, ei);
    if (ex.reps) return;
    document.getElementById('play-'+id).onclick = () => toggle(id);
    document.getElementById('reset-'+id).onclick = () => reset(id);
    setPlayIcon(id);
    updateVisual(id);
  }));

  document.querySelectorAll('.tab').forEach(t => t.onclick = () => showFicha(+t.dataset.f, true));
  showFicha(location.hash === '#ficha2' ? 1 : 0, false);
}

function showFicha(fi, scroll){
  // pausa timers en marcha para que no suene la campanita en la otra ficha
  Object.keys(state).forEach(id => { if (state[id].running) toggle(id); });
  [0, 1].forEach(i => { document.getElementById('ficha-'+i).hidden = (i !== fi); });
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', String(+t.dataset.f === fi)));
  history.replaceState(null, '', fi === 1 ? '#ficha2' : '#ficha1');
  if (scroll){
    const top = document.querySelector('.tabs').offsetTop;
    window.scrollTo(0, Math.max(0, document.querySelector('.page-header').offsetHeight - 0));
  }
}

function setPlayIcon(id){
  const btn = document.getElementById('play-'+id);
  btn.innerHTML = state[id].running
    ? `<svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/></svg>`
    : `<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>`;
}

function updateVisual(id){
  const s = state[id];
  document.getElementById('time-'+id).textContent = fmt(s.remaining);
  const offset = CIRC * (1 - s.remaining / s.duration);
  document.getElementById('ring-'+id).setAttribute('stroke-dashoffset', offset);
  if (s.segs){
    const lab = document.getElementById('seg-'+id);
    lab.innerHTML = s.done
      ? 'Concluído'
      : `${s.segs[s.seg][0]}<span class="seg-count">${s.seg+1}/${s.segs.length}</span>`;
  }
}

function toggle(id){
  const s = state[id];
  if (s.done) reset(id);
  s.running = !s.running;
  if (s.running){
    ensureAudio();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    s.timerId = setInterval(() => tick(id), 1000);
  } else {
    clearInterval(s.timerId);
  }
  setPlayIcon(id);
}

function tick(id){
  const s = state[id];
  s.remaining -= 1;
  if (s.remaining <= 0 && s.segs && s.seg < s.segs.length - 1){
    s.seg += 1;
    s.duration = s.remaining = s.segs[s.seg][1];
    updateVisual(id);
    playBell();
    return;
  }
  if (s.remaining <= 0){
    s.remaining = 0;
    s.done = true;
    updateVisual(id);
    clearInterval(s.timerId);
    s.running = false;
    setPlayIcon(id);
    playBell();
    return;
  }
  updateVisual(id);
}

function reset(id){
  const s = state[id];
  clearInterval(s.timerId);
  s.seg = 0;
  s.done = false;
  s.duration = s.segs ? s.segs[0][1] : s.duration;
  s.remaining = s.duration;
  s.running = false;
  setPlayIcon(id);
  updateVisual(id);
}

buildPage();
</script>
</body>
</html>
